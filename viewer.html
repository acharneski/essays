<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Essay</title>
  <style>
    body { font-family: Georgia, serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; line-height: 1.6; color: #222; }
    pre { background: #f5f5f5; padding: .8rem; overflow-x: auto; }
    code { background: #f5f5f5; padding: 0 .2rem; }
    pre code { padding: 0; }
    table { border-collapse: collapse; }
    td, th { border: 1px solid #ccc; padding: .3rem .6rem; }
    blockquote { border-left: 4px solid #ddd; margin-left: 0; padding-left: 1rem; color: #555; }
    img { max-width: 100%; }
    nav a { color: #0b5cad; text-decoration: none; }
  </style>
</head>
<body>
  <nav><a href="index.html">← All essays</a></nav>
  <main id="content">Loading…</main>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="manifest.js"></script>
  <script>
    const file = new URLSearchParams(location.search).get('file');
    const target = document.getElementById('content');
    if (!file) {
      target.textContent = 'No file specified.';
    } else {
      EssayManifest.renderMarkdown(file, target).then((title) => { if (title) document.title = title; });
    }
  </script>
</body>
</html>
